services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: misis_bot_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: misis_bot
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - HF_MODEL=${HF_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      - HF_TOKEN=${HF_TOKEN}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-misis_bot_vectors}
      - MAX_NEW_TOKENS=${MAX_NEW_TOKENS:-512}
      - TEMPERATURE=${TEMPERATURE:-0.7}
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    command: python -m bot.run


volumes:
  qdrant_storage:
    driver: local
